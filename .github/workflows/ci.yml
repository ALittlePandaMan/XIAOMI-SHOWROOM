name: CI, Docker and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const tag=process.env.RELEASE_TAG;
          assert.match(tag,/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/);
          assert.equal(tag.slice(1),JSON.parse(readFileSync('package.json','utf8')).version,'Tag must match package.json');
          NODE
      - run: npm ci
      - run: npm run check
      - name: Include license notices in website downloads
        if: startsWith(github.ref, 'refs/tags/')
        run: cp LICENSE THIRD_PARTY_NOTICES.md dist/
      - name: Keep the release website
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  container:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build the test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: xiaomi-showroom:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test Nginx and packaged assets
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.build.yaml config --quiet
          bash scripts/smoke-container.sh xiaomi-showroom:test
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Xiaomi Showroom
            org.opencontainers.image.description=Interactive N70 and N90 Max 3D vehicle showroom
            org.opencontainers.image.licenses=MIT
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish AMD64 and ARM64 images
        id: publish
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, container]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.ref_name }}
      IMAGE: ${{ needs.container.outputs.image }}
      IMAGE_DIGEST: ${{ needs.container.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website
          path: dist/
      - name: Package website and deployment files
        run: |
          mkdir -p artifacts/release
          tar -czf "artifacts/release/xiaomi-showroom-$RELEASE_TAG-site.tar.gz" -C dist .
          (cd dist && zip -qr "../artifacts/release/xiaomi-showroom-$RELEASE_TAG-site.zip" .)
          zip -q "artifacts/release/xiaomi-showroom-$RELEASE_TAG-deploy.zip" compose.yaml .env.example LICENSE THIRD_PARTY_NOTICES.md docs/deployment.md
          (cd artifacts/release && sha256sum ./*.tar.gz ./*.zip > SHA256SUMS)
          {
            printf '## Docker / 容器部署\n\n'
            printf 'AMD64 and ARM64 / 支持 AMD64、ARM64。\n\n'
            printf '```bash\ndocker run -d --name xiaomi-showroom --restart unless-stopped -p 8080:8080 %s:%s\n```\n\n' "$IMAGE" "$RELEASE_TAG"
            printf 'Open / 访问: http://localhost:8080\n\n'
            printf 'Image digest / 镜像摘要: `%s@%s`\n\n' "$IMAGE" "$IMAGE_DIGEST"
            printf '## Downloads / 下载\n\n'
            printf -- '- `*-site.zip` / `*-site.tar.gz`: ready-to-serve static website / 可直接部署的静态网站。\n'
            printf -- '- `*-deploy.zip`: Docker Compose configuration and guide / Compose 配置与部署说明。\n'
            printf -- '- `SHA256SUMS`: download checksums / 下载文件校验值。\n\n'
            printf 'Original code: MIT. Third-party assets retain their own licenses. / 原创代码采用 MIT，第三方资源保留原许可。\n'
          } > artifacts/release-notes.md
      - name: Publish GitHub Release
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/release/* --clobber
          else
            args=(--verify-tag --generate-notes --title "Xiaomi Showroom $RELEASE_TAG" --notes-file artifacts/release-notes.md)
            if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease --latest=false); fi
            gh release create "$RELEASE_TAG" artifacts/release/* "${args[@]}"
          fi
